version: '3.8'

services:
  jobintel-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: jobintel:2.0.0
    container_name: jobintel_production
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:8000
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
