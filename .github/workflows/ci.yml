name: JobIntel Production CI & Verification Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-code-quality:
    name: Backend Code Quality & Contract CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python Syntax Compilation & Import Verification
        run: |
          python -m compileall src/

      - name: Run Code-Only Contract Tests
        run: |
          python -m pytest tests/test_routing_contracts.py tests/test_schema_contracts.py -v

  frontend-build-and-lint:
    name: Frontend Build, Lint & Vitest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package.json'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Run Frontend Vitest Test Suite
        working-directory: frontend
        run: npm test

      - name: Run Frontend Linter
        working-directory: frontend
        run: npm run lint

      - name: Run Production Bundle Build & Typecheck
        working-directory: frontend
        run: npm run build
