name: JobIntel Phase 8.6.1 Protected Docker Release Gate

on:
  workflow_dispatch:

defaults:
  run:
    shell: powershell

jobs:
  docker-release-gate:
    name: Docker Runtime Verification & Release Gate (Windows Self-Hosted)
    runs-on: [self-hosted, Windows, X64, jobintel-private-data]

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package.json'

      - name: 4. Verify Windows Runner Environment
        run: |
          Write-Host "=== 1. VERIFYING WINDOWS RUNNER ENVIRONMENT ==="
          Write-Host "OS: $((Get-CimInstance Win32_OperatingSystem).Caption)"
          Write-Host "Architecture: $env:PROCESSOR_ARCHITECTURE"
          Write-Host "Workspace: ${{ github.workspace }}"
          Write-Host "PowerShell Version: $($PSVersionTable.PSVersion)"

      - name: 5. Verify Docker Availability
        run: |
          Write-Host "=== 2. VERIFYING DOCKER AVAILABILITY ==="
          docker --version
          if ($LASTEXITCODE -ne 0) { Write-Error "Docker CLI not found"; exit 1 }
          docker info
          if ($LASTEXITCODE -ne 0) { Write-Error "Docker daemon not running"; exit 1 }

      - name: 6. Verify Exact Host Data Paths & Required Parquets
        run: |
          Write-Host "=== 3 & 4. VERIFYING HOST DATA PATHS AND FROZEN PARQUETS ==="
          $hostDataPath = "E:/Job Market/data/processed"
          if (-not (Test-Path "$hostDataPath/modeling_dataset.parquet")) {
              $found = Get-ChildItem -Path "E:\" -Filter "modeling_dataset.parquet" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) {
                  $hostDataPath = $found.Directory.FullName -replace '\\', '/'
              } else {
                  Write-Error "CRITICAL: modeling_dataset.parquet not found on host E: drive!"
                  exit 1
              }
          }
          Write-Host "Discovered Host Data Path: $hostDataPath"
          
          $usaParquet = "$hostDataPath/modeling_dataset.parquet"
          $indiaParquet = "$hostDataPath/india/india_modeling_cohort.parquet"
          
          if (-not (Test-Path $usaParquet)) {
              Write-Error "Missing USA modeling dataset: $usaParquet"
              exit 1
          }
          if (-not (Test-Path $indiaParquet)) {
              Write-Error "Missing India modeling cohort: $indiaParquet"
              exit 1
          }
          
          Write-Host "PASS: Both required private Parquet files verified on host."
          "HOST_DATA_PATH=$hostDataPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: 7. Verify Dockerfile Does Not COPY data/processed
        run: |
          Write-Host "=== 5. VERIFYING DOCKERFILE PRIVACY COMPLIANCE ==="
          $dockerfile = Get-Content Dockerfile -Raw
          if ($dockerfile -match "COPY\s+data/processed") {
              Write-Error "CRITICAL VIOLATION: Dockerfile must NOT COPY data/processed!"
              exit 1
          }
          Write-Host "PASS: Dockerfile does not copy private data into image."

      - name: 8. Build Production Docker Image
        run: |
          Write-Host "=== 6. BUILDING DOCKER IMAGE ==="
          docker build --no-cache -t jobintel-phase8-6-certification .
          if ($LASTEXITCODE -ne 0) { Write-Error "Docker build failed"; exit 1 }

      - name: 9. Start Container with Read-Only Private-Data Mount
        run: |
          Write-Host "=== 7. STARTING CONTAINER WITH READ-ONLY DATA MOUNT ==="
          docker stop jobintel-phase8-6-certification 2>$null
          docker rm jobintel-phase8-6-certification 2>$null
          
          docker run -d `
            --name jobintel-phase8-6-certification `
            -p 8000:8000 `
            -e CORS_ORIGINS="http://localhost:5173,http://localhost:3000,http://localhost:8000" `
            -v "${env:HOST_DATA_PATH}:/app/data/processed:ro" `
            jobintel-phase8-6-certification
            
          if ($LASTEXITCODE -ne 0) { Write-Error "Docker run failed"; exit 1 }
          
          Write-Host "Waiting 8 seconds for application warmup..."
          Start-Sleep -Seconds 8
          docker ps
          docker logs --tail 35 jobintel-phase8-6-certification

      - name: 10. Verify Container Filesystem & Read-Only Mount
        run: |
          Write-Host "=== 8 & 9. VERIFYING CONTAINER FILESYSTEM & READ-ONLY MOUNT ==="
          docker exec jobintel-phase8-6-certification ls -la /app/data/processed/modeling_dataset.parquet
          docker exec jobintel-phase8-6-certification ls -la /app/data/processed/india/india_modeling_cohort.parquet
          if ($LASTEXITCODE -ne 0) { Write-Error "Mounted datasets missing in container"; exit 1 }
          
          # Prove write rejection
          docker exec jobintel-phase8-6-certification touch /app/data/processed/test_mutation.txt 2>$null
          if ($LASTEXITCODE -eq 0) {
              Write-Error "CRITICAL SECURITY BREACH: Volume mount is NOT read-only!"
              exit 1
          }
          Write-Host "PASS: Container mount verified read-only (:ro)."

      - name: 11. In-Container Cryptographic Hash Verification (10/10)
        run: |
          Write-Host "=== 10. VERIFYING 10/10 FROZEN ARTIFACT SHA-256 INSIDE CONTAINER ==="
          docker exec jobintel-phase8-6-certification python -c "
          import hashlib, sys

          EXPECTED = {
              'models/india/final_model.pkl': '7a3490d7a36a128eea5a70e80bb3550c504da69648ac368a891f8729282a8310',
              'models/india/final_preprocessor.pkl': '0ee1dabf3130a19c8bbc80a31ab93d8e97affa4d4a688249d59ee336f7ab4ead',
              'data/processed/india/india_modeling_cohort.parquet': 'd4e32be45d84b159804e1a019f44dd5da6682346e38f39635e8edcaac3a200ec',
              'models/india/india_pca_v1.pkl': '8591e3d3f713e35b27307e0c5810b35bb80ee33fd97bc909487985624e390897',
              'models/india/india_kmeans_v1.pkl': '4465a3d8c3b7ab92e668cab2b502bdc3ba832d8458545f00cc5121d9c73da40a',
              'models/phase5/best_model.pkl': '55c1b7fd87d2a04c9761a1941fcc4f6d3174ed80a10ce0802b0c07fc644bfadd',
              'models/phase5/best_pipeline.pkl': '815fd9a3d88f2ebae82cebce86c6438d0455835de8de1bb8d66802f12a77be19',
              'data/processed/modeling_dataset.parquet': '68895e3823cca91ffbfea76b8986198700b4eb8bb02905bacc9a04985156a21b',
              'models/pca_phase4_1.pkl': 'ef4ef56bdc4b9471b1ec636fb9c689744832992b13f9733549271a19e3ce83c0',
              'models/kmeans_phase4_1_k7.pkl': '4d6d2509f04502fdf088604151b66d2272a8b4de106ce9fa2f745f97806c0106',
          }

          mismatches = []
          for relpath, expected_hash in EXPECTED.items():
              fullpath = f'/app/{relpath}'
              try:
                  with open(fullpath, 'rb') as f:
                      actual_hash = hashlib.sha256(f.read()).hexdigest()
                  if actual_hash != expected_hash:
                      mismatches.append(f'{relpath}: expected {expected_hash}, got {actual_hash}')
                  else:
                      print(f'MATCH (100%): {relpath}')
              except Exception as e:
                  mismatches.append(f'{relpath}: ERROR {e}')

          if mismatches:
              print('FAILURE: Hash mismatches inside container:')
              for m in mismatches:
                  print(f'  {m}')
              sys.exit(1)
          print('PASS: All 10 frozen artifacts matched bit-for-bit inside container.')
          "
          if ($LASTEXITCODE -ne 0) { Write-Error "Hash verification failed"; exit 1 }

      - name: 12. Verify Application Imports, ModelRegistry & Feature Contracts
        run: |
          Write-Host "=== 11, 16, 17 & 18. VERIFYING REGISTRY & CONTRACTS ==="
          docker exec jobintel-phase8-6-certification python -c "
          from src.backend.models.model_registry import get_model_registry
          from src.backend.data_service import get_salary_model

          r = get_model_registry()
          s = r.get_status_report()
          assert s['status'] == 'GREEN', f'Status: {s}'
          assert s['artifacts_verified_count'] == 10, f'Artifact count: {s}'

          # Exact USA Contract: 123 features
          usa_feats = len(r.usa_feature_metadata['feature_names'])
          print(f'USA Feature Count: {usa_feats}')
          assert usa_feats == 123, f'Expected 123 USA features, got {usa_feats}'

          # Exact India Contract: 290 features
          india_feats = len(r.india_model_metadata['feature_names'])
          print(f'India Feature Count: {india_feats}')
          assert india_feats == 290, f'Expected 290 India features, got {india_feats}'

          # Singleton check
          assert get_salary_model() is r.usa_salary_model, 'Singleton model mismatch'
          print('PASS: ModelRegistry GREEN, USA=123, India=290, Singleton verified.')
          "
          if ($LASTEXITCODE -ne 0) { Write-Error "Registry contract assertion failed"; exit 1 }

      - name: 13. Verify Health & Readiness Probes
        run: |
          Write-Host "=== 12 & 13. TESTING /api/health AND /api/ready PROBES ==="
          $health = Invoke-RestMethod -Uri "http://localhost:8000/api/health" -Method Get
          Write-Host "Health: $($health | ConvertTo-Json -Compress)"
          if ($health.status -ne "healthy") { Write-Error "Health check failed"; exit 1 }

          $ready = Invoke-RestMethod -Uri "http://localhost:8000/api/ready" -Method Get
          Write-Host "Ready: $($ready | ConvertTo-Json -Compress)"
          if ($ready.status -ne "ready" -or -not $ready.ready) { Write-Error "Readiness check failed"; exit 1 }
          if ($ready.artifacts_verified_count -ne 10) { Write-Error "Expected 10 verified artifacts"; exit 1 }
          Write-Host "PASS: Health and Readiness probes returned HTTP 200 GREEN."

      - name: 14. Verify USA Live Inference
        run: |
          Write-Host "=== 14. TESTING USA LIVE INFERENCE ==="
          $payload = @{
              role_family = "ML / AI Engineer"
              seniority = "Senior"
              city_clean = "San Francisco"
              is_remote = $true
              selected_skills = @("skill_python", "skill_machine_learning", "skill_pytorch")
          } | ConvertTo-Json

          $resp = Invoke-RestMethod -Uri "http://localhost:8000/api/usa/predict" -Method Post -ContentType "application/json" -Body $payload
          Write-Host "USA Prediction: $($resp | ConvertTo-Json -Compress)"
          if (-not $resp.predicted_salary -or $resp.predicted_salary -le 0) {
              Write-Error "Invalid USA prediction"
              exit 1
          }
          if ($resp.model_metadata.feature_count -ne 123) {
              Write-Error "Expected 123 features in model metadata"
              exit 1
          }
          Write-Host "PASS: USA live prediction verified ($($resp.predicted_salary))."

      - name: 15. Verify India Live Inference
        run: |
          Write-Host "=== 15. TESTING INDIA LIVE INFERENCE ==="
          $payload = @{
              normalized_role = "Data Scientist"
              experience_midpoint_years = 5.0
              experience_range_years = 2.0
              city_grouped = "Bengaluru"
              work_mode = "Hybrid"
              selected_skills = @("skill_python", "skill_sql", "skill_machine_learning")
          } | ConvertTo-Json

          $resp = Invoke-RestMethod -Uri "http://localhost:8000/api/india/predict" -Method Post -ContentType "application/json" -Body $payload
          Write-Host "India Prediction: $($resp | ConvertTo-Json -Compress)"
          if (-not $resp.predicted_salary_lpa -and -not $resp.predicted_salary_inr -and -not $resp.predicted_salary) {
              Write-Error "Missing predicted salary in India response"
              exit 1
          }
          if ($resp.model_metadata.feature_count -ne 290) {
              Write-Error "Expected 290 features in India model metadata"
              exit 1
          }
          Write-Host "PASS: India live prediction verified."

      - name: 16. Verify Skills Explorer Endpoints & Error Handling
        run: |
          Write-Host "=== 19 & 24. TESTING SKILLS EXPLORER & ERROR HANDLING ==="
          $usaSkill = Invoke-RestMethod -Uri "http://localhost:8000/api/skills/detail/python" -Method Get
          Write-Host "USA Skill Python: $($usaSkill.skill), Postings: $($usaSkill.postings)"
          if ($usaSkill.skill -ne "python") { Write-Error "Unexpected USA skill response"; exit 1 }

          # Unknown skill must return 404
          $usa404 = $false
          try {
              Invoke-WebRequest -Uri "http://localhost:8000/api/skills/detail/nonexistent_xyz" -Method Get
          } catch {
              if ($_.Exception.Response.StatusCode.value__ -eq 404) { $usa404 = $true }
          }
          if (-not $usa404) { Write-Error "Expected 404 for unknown USA skill"; exit 1 }
          Write-Host "PASS: Unknown USA skill returned HTTP 404."

          $indSkill = Invoke-RestMethod -Uri "http://localhost:8000/api/india/skills/python" -Method Get
          Write-Host "India Skill Python: $($indSkill.display_name)"

          $ind404 = $false
          try {
              Invoke-WebRequest -Uri "http://localhost:8000/api/india/skills/nonexistent_xyz" -Method Get
          } catch {
              if ($_.Exception.Response.StatusCode.value__ -eq 404) { $ind404 = $true }
          }
          if (-not $ind404) { Write-Error "Expected 404 for unknown India skill"; exit 1 }
          Write-Host "PASS: Unknown India skill returned HTTP 404."

      - name: 17. Verify Market Explorer & Archetypes Endpoints
        run: |
          Write-Host "=== 20, 21 & 25. TESTING MARKET & ARCHETYPES (NO FABRICATION) ==="
          $usaMarket = Invoke-RestMethod -Uri "http://localhost:8000/api/usa/market-summary" -Method Get
          if ($usaMarket.by_seniority.Count -le 0) { Write-Error "Empty USA market seniority items"; exit 1 }

          $indMarket = Invoke-RestMethod -Uri "http://localhost:8000/api/india/market-summary" -Method Get
          if (-not $indMarket) { Write-Error "Empty India market summary"; exit 1 }

          $usaArch = Invoke-RestMethod -Uri "http://localhost:8000/api/archetypes/list" -Method Get
          Write-Host "USA Archetypes Count: $($usaArch.Count)"
          if ($usaArch.Count -ne 7) { Write-Error "Expected 7 USA archetypes, got $($usaArch.Count)"; exit 1 }

          $indArch = Invoke-RestMethod -Uri "http://localhost:8000/api/india/archetypes" -Method Get
          Write-Host "India Archetypes Count: $($indArch.Count)"
          if ($indArch.Count -ne 6) { Write-Error "Expected 6 India archetypes, got $($indArch.Count)"; exit 1 }
          Write-Host "PASS: Empirical Market & Archetype endpoints verified."

      - name: 18. Verify Cross-Market Analytics Endpoint
        run: |
          Write-Host "=== 22. TESTING CROSS-MARKET ANALYTICS ==="
          $cm = Invoke-RestMethod -Uri "http://localhost:8000/api/cross-market/summary" -Method Get
          Write-Host "Shared Skills Prevalence Count: $($cm.shared_skills_prevalence.Count)"
          if ($cm.shared_skills_prevalence.Count -le 0) { Write-Error "Empty shared skills in cross-market summary"; exit 1 }
          Write-Host "PASS: Cross-market analytics returned empirical shared distributions."

      - name: 19. Verify Security & Input Validation
        run: |
          Write-Host "=== 26. TESTING SECURITY & INPUT VALIDATION ==="
          $oversizedSkills = @(1..65) | ForEach-Object { "skill_$_" }
          $badPayload = @{
              role_family = "Software Engineer"
              seniority = "Senior"
              city_clean = "San Francisco"
              is_remote = $true
              selected_skills = $oversizedSkills
          } | ConvertTo-Json

          $rejected = $false
          try {
              Invoke-WebRequest -Uri "http://localhost:8000/api/usa/predict" -Method Post -ContentType "application/json" -Body $badPayload
          } catch {
              if ($_.Exception.Response.StatusCode.value__ -eq 422) { $rejected = $true }
          }
          if (-not $rejected) { Write-Error "Expected HTTP 422 for oversized skills payload"; exit 1 }
          Write-Host "PASS: Oversized payload rejected with HTTP 422."

      - name: 20. Host-Side Backend Tests with Linked Private Data
        run: |
          Write-Host "=== RUNNING HOST-SIDE BACKEND TEST SUITE ==="
          if (-not (Test-Path "${{ github.workspace }}/data/processed")) {
              cmd.exe /c "mklink /J `"${{ github.workspace }}\data\processed`" `"${env:HOST_DATA_PATH}`""
          }
          python -m pip install -r requirements.txt
          python -m pytest tests/ -v
          if ($LASTEXITCODE -ne 0) { Write-Error "Host-side pytest suite failed"; exit 1 }

      - name: 21. Host-Side Frontend Tests, Lint & Build
        run: |
          Write-Host "=== RUNNING FRONTEND VALIDATION ==="
          Set-Location frontend
          npm ci
          if ($LASTEXITCODE -ne 0) { npm install }
          npm test
          if ($LASTEXITCODE -ne 0) { Write-Error "Vitest suite failed"; exit 1 }
          npm run lint
          if ($LASTEXITCODE -ne 0) { Write-Error "ESLint failed"; exit 1 }
          npm run build
          if ($LASTEXITCODE -ne 0) { Write-Error "Vite build failed"; exit 1 }
          Set-Location ..

      - name: 22. Container Log Audit & Cleanup
        if: always()
        run: |
          Write-Host "=== 27 & 28. CONTAINER LOG AUDIT & CLEANUP ==="
          docker logs jobintel-phase8-6-certification > container.log 2>&1
          Get-Content container.log | Select-Object -Last 30
          $logContent = Get-Content container.log -Raw
          if ($logContent -match "Traceback \(most recent call last\)") {
              Write-Error "Fatal traceback detected in container log!"
              exit 1
          }
          if ($logContent -match "ModuleNotFoundError") {
              Write-Error "ModuleNotFoundError detected in container log!"
              exit 1
          }
          Write-Host "PASS: Zero fatal errors in container log."

          Write-Host "Stopping and removing container..."
          docker stop jobintel-phase8-6-certification 2>$null
          docker rm jobintel-phase8-6-certification 2>$null
          
          # Clean workspace junction if created
          if (Test-Path "${{ github.workspace }}/data/processed") {
              cmd.exe /c "rmdir `"${{ github.workspace }}\data\processed`"" 2>$null
          }

      - name: 23. Post-Runtime Frozen Hash Verification (10/10)
        run: |
          Write-Host "=== 29. POST-RUNTIME FROZEN HASH VERIFICATION ON HOST ==="
          python -c "
          import hashlib, sys
          ARTIFACTS = {
              'models/india/final_model.pkl': '7a3490d7a36a128eea5a70e80bb3550c504da69648ac368a891f8729282a8310',
              'models/india/final_preprocessor.pkl': '0ee1dabf3130a19c8bbc80a31ab93d8e97affa4d4a688249d59ee336f7ab4ead',
              'data/processed/india/india_modeling_cohort.parquet': 'd4e32be45d84b159804e1a019f44dd5da6682346e38f39635e8edcaac3a200ec',
              'models/india/india_pca_v1.pkl': '8591e3d3f713e35b27307e0c5810b35bb80ee33fd97bc909487985624e390897',
              'models/india/india_kmeans_v1.pkl': '4465a3d8c3b7ab92e668cab2b502bdc3ba832d8458545f00cc5121d9c73da40a',
              'models/phase5/best_model.pkl': '55c1b7fd87d2a04c9761a1941fcc4f6d3174ed80a10ce0802b0c07fc644bfadd',
              'models/phase5/best_pipeline.pkl': '815fd9a3d88f2ebae82cebce86c6438d0455835de8de1bb8d66802f12a77be19',
              'data/processed/modeling_dataset.parquet': '68895e3823cca91ffbfea76b8986198700b4eb8bb02905bacc9a04985156a21b',
              'models/pca_phase4_1.pkl': 'ef4ef56bdc4b9471b1ec636fb9c689744832992b13f9733549271a19e3ce83c0',
              'models/kmeans_phase4_1_k7.pkl': '4d6d2509f04502fdf088604151b66d2272a8b4de106ce9fa2f745f97806c0106',
          }
          for p, expected in ARTIFACTS.items():
              actual = hashlib.sha256(open(p, 'rb').read()).hexdigest()
              assert actual == expected, f'Post-run hash mismatch for {p}: expected {expected}, got {actual}'
          print('PASS: All 10 frozen artifacts remain 100% bit-for-bit unchanged after runtime.')
          "
          if ($LASTEXITCODE -ne 0) { Write-Error "Post-runtime hash check failed"; exit 1 }
